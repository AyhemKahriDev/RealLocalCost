name: Nightly watch

# The watcher never writes a price. It hashes every pricing page and
# raises an alert when one changes, so a human goes and re-reads it.
# If a page changed, this workflow opens an issue with what it found.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Watch the pricing pages
        run: node tools/watch.mjs

      - name: Commit the new hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json data/alerts.json
          git diff --staged --quiet || git commit -m "watch: pricing page hashes $(date -u +%Y-%m-%d)"
          git push || true

      - name: Raise an issue if a pricing page moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const a = JSON.parse(fs.readFileSync("data/alerts.json", "utf8"));
          const open = (a.alerts || []).filter((x) => x.type === "page-changed" && x.status !== "resolved");
          if (!open.length) { console.log("no open alerts"); process.exit(0); }
          const lines = open.slice(0, 20).map((x) =>
            `- **${x.service} / ${x.market}** — page changed on ${x.date}\n  ${x.url}`
          ).join("\n");
          const body = `A pricing page changed. The machine has flagged it; a human has to re-read the price.\n\n${lines}\n\n` +
            "Steps: open the page, find the current price, update the matching row in `data/prices.json` " +
            "(price, history, `verified` date, receipt), then run `node tools/make-changes.mjs && node src/build.mjs`.";
          console.log("opening issue");
          const { execFileSync } = require("child_process");
          execFileSync("gh", ["issue", "create", "--title", "Pricing page changed: " + open.length + " service/market", "--body", body], { stdio: "inherit" });
          EOF

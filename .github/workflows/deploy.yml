name: Deploy

# One source, two homes:
#   Cloudflare Pages  ->  reallocalcost.pages.dev            (the canonical site)
#   GitHub Pages      ->  ayhemkahridev.github.io/RealLocalCost/  (the mirror)
#
# The two differ only in the base path, so the site is built once for
# each. The canonical URL, the sitemap and the hreflang alternates
# always point at the Cloudflare site, because that is the original.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the site
        run: node src/build.mjs --base=/RealLocalCost/

      - name: Check the data
        run: node tools/check.mjs

      - name: Refresh the social card
        run: node tools/make-og.mjs
        continue-on-error: true

      - name: Rebuild with the social card in place
        run: node src/build.mjs --base=/RealLocalCost/

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the site
        run: node src/build.mjs --base=/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret, so the Cloudflare deploy is skipped."
            echo "The GitHub Pages mirror is still published by this run."
            exit 0
          fi
          npx --yes wrangler@4.151.3 pages deploy site --project-name=reallocalcost --branch=main --commit-dirty=true

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
